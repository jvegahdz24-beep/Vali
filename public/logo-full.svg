<svg width="900" height="420" viewBox="0 0 900 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="80" y1="120" x2="280" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#7B5EFF"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="textGradient" x1="420" y1="180" x2="820" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="45%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <path d="M90 150 Q60 150 60 190 Q60 230 90 230 L140 230 L155 265 L170 230 Q210 230 210 190 Q210 150 170 150 Z" fill="#0F172A" stroke="#67E8F9" stroke-width="18"/>
    
    <path d="M120 170 Q160 120 210 170 Q250 220 190 260 Q150 200 175 175" fill="none" stroke="url(#iconGradient)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    
    <path d="M135 175 Q165 145 200 175" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <path d="M145 195 Q175 225 195 195" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
    
    <path d="M205 165 L255 165 L245 135 Z" fill="#00F5FF"/>
    <path d="M205 165 L255 165 L245 195 Z" fill="#00F5FF"/>
    
    <circle cx="135" cy="165" r="9" fill="#FFFFFF"/>
    <circle cx="190" cy="225" r="8" fill="#A5B4FC"/>
  </g>

  <text x="310" y="215" font-family="system-ui, -apple-system, Arial Black, sans-serif" font-size="115" font-weight="900" fill="url(#textGradient)" letter-spacing="-4px">VALI</text>
  <text x="535" y="215" font-family="system-ui, -apple-system, Arial Black, sans-serif" font-size="115" font-weight="700" fill="#CBD5E1" letter-spacing="-3.5px">AutoFlow</text>

  <text x="310" y="275" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="23" font-weight="600" fill="#94A3B8" letter-spacing="3px">AUTOMATIZACIÓN INTELIGENTE DE VENTAS</text>
</svg>
