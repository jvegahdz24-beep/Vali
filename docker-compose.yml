version: '3.8'

services:
  valiautoflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: valiautoflow-crm
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/custom.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production-32chars-min}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - DEMO_EMAIL=${DEMO_EMAIL:-jvegahdz24@gmail.com}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-valiflow2026}
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - SEED_PIN=${SEED_PIN:-}
      - WORKER_KEY=${WORKER_KEY:-}
      - CRON_SECRET=${CRON_SECRET:-}
      - PRISMA_LOG=false
    volumes:
      - valiautoflow-data:/app/data
      - valiautoflow-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

volumes:
  valiautoflow-data:
    driver: local
  valiautoflow-uploads:
    driver: local
