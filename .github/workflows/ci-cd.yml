name: ValiAutoFlow CI/CD

on:
  push:
    branches: [main, production-ready]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24'

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm test
      - run: npm run test:coverage

  build:
    runs-on: ubuntu-latest
    needs: test
    # Build-only values: production secrets are injected only by the target host.
    env:
      NODE_ENV: production
      NEXTAUTH_SECRET: ci-build-only-not-a-production-secret-2026
      NEXTAUTH_URL: http://localhost:3000
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/valiautoflow
      DIRECT_URL: mysql://ci:ci@127.0.0.1:3306/valiautoflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Build tooling is in devDependencies; keep it installed despite production NODE_ENV.
      - run: npm ci --include=dev
      - run: npm run build
      - name: Upload standalone build
        uses: actions/upload-artifact@v4
        with:
          name: standalone-build
          path: .next/standalone/
          if-no-files-found: error
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/production-ready'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: standalone-build
          path: .next/standalone/
      - name: Deploy to production via SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -r .next/standalone/ $DEPLOY_HOST:/app/valiautoflow/
          ssh -i ~/.ssh/deploy_key $DEPLOY_HOST "cd /app/valiautoflow && pm2 restart valiautoflow || NODE_OPTIONS='--max-old-space-size=4096' PORT=3000 nohup node .next/standalone/server.js &"
