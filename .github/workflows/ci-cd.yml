name: ValiAutoFlow CI/CD

on:
  push:
    branches: [main, production-ready]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24'

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm test
      - run: npm run test:coverage

  build:
    runs-on: ubuntu-latest
    needs: test
    # Build-only values: production secrets are injected only by the target host.
    env:
      NODE_ENV: production
      NEXTAUTH_SECRET: ci-build-only-not-a-production-secret-2026
      NEXTAUTH_URL: http://localhost:3000
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/valiautoflow
      DIRECT_URL: mysql://ci:ci@127.0.0.1:3306/valiautoflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Build tooling is in devDependencies; keep it installed despite production NODE_ENV.
      - run: npm ci --include=dev
      - run: npm run build
      - name: Upload standalone build
        uses: actions/upload-artifact@v4
        with:
          name: standalone-build
          path: .next/standalone/
          if-no-files-found: error
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/production-ready'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: standalone-build
          path: .next/standalone/
      - name: Validate deployment configuration
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_REMOTE_DIR: ${{ vars.DEPLOY_REMOTE_DIR || '/app/valiautoflow' }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '3105' }}
        run: |
          if [[ -z "$DEPLOY_SSH_KEY" || -z "$DEPLOY_HOST" ]]; then
            echo "Deployment blocked: DEPLOY_SSH_KEY and DEPLOY_HOST must be configured as GitHub Actions secrets."
            exit 1
          fi

      - name: Deploy to production via SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_REMOTE_DIR: ${{ vars.DEPLOY_REMOTE_DIR || '/app/valiautoflow' }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '3105' }}
        run: |
          set -euo pipefail
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [[ -n "$DEPLOY_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${DEPLOY_HOST#*@}" >> ~/.ssh/known_hosts 2>/dev/null
          fi

          # Copy the contents, not the directory itself: server.js must live at
          # /app/valiautoflow/server.js, matching Next.js standalone output.
          scp -r -i ~/.ssh/deploy_key .next/standalone/. "$DEPLOY_HOST:$DEPLOY_REMOTE_DIR/"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_HOST" "cd '$DEPLOY_REMOTE_DIR' && if pm2 describe valiautoflow >/dev/null 2>&1; then NODE_ENV=production HOSTNAME=0.0.0.0 PORT='$DEPLOY_PORT' pm2 restart valiautoflow --update-env; else NODE_ENV=production HOSTNAME=0.0.0.0 PORT='$DEPLOY_PORT' NODE_OPTIONS='--max-old-space-size=4096' nohup node server.js > valiautoflow.log 2>&1 & fi"

          for attempt in {1..12}; do
            if ssh -i ~/.ssh/deploy_key "$DEPLOY_HOST" "curl --fail --silent --show-error --max-time 5 http://127.0.0.1:$DEPLOY_PORT/api/health >/dev/null"; then
              echo "Remote health check passed on attempt $attempt."
              exit 0
            fi
            sleep 5
          done
          echo "Remote health check failed after restart."
          exit 1
