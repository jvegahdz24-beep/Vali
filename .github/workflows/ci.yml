name: CI — Build, Lint, Test

on:
  push:
    branches: [main, develop, feat/*]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: valiflow
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: valiautoflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://valiflow:test_password@localhost:5432/valiautoflow_test
      - run: npm test
        env:
          DATABASE_URL: postgresql://valiflow:test_password@localhost:5432/valiautoflow_test
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_SECRET: ci-test-secret-at-least-32-characters-long!!
          NODE_ENV: test
